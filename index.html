<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Party — Kits para crear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#6E509C;--mint:#B8E7DC;--lav:#E0CFE4;--peach:#FADCCA;--white:#fff;
  --pink:#F2A6C4;--turq:#83E7CF;--yellow:#FFD451;--orange:#FFA66E;
  --shadow:0 6px 18px rgba(110,80,156,.14);
  --display:'Baloo 2',sans-serif;--body:'Nunito Sans',sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--mint);color:var(--purple);font-family:var(--body);padding-bottom:96px}
button{font-family:var(--body);cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(184,231,220,.94);backdrop-filter:blur(6px)}
.wrap{max-width:1000px;margin:0 auto}
header .logo{height:46px;display:block}
#cart-btn{position:relative;width:46px;height:46px;border-radius:50%;background:var(--white);font-size:1.3rem;box-shadow:var(--shadow)}
#cart-count{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--pink);border:2px solid #fff;font-size:.72rem;font-weight:800;color:var(--purple);display:none;align-items:center;justify-content:center}
.hero{margin:12px 16px 8px;padding:30px 20px 34px;background:var(--peach);border-radius:32px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero i{position:absolute;font-style:normal;font-size:1.5rem}
.hero h1{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.02;margin:0 0 8px;letter-spacing:-.5px;transform:rotate(-1.5deg)}
.hero p{margin:0 auto 18px;max-width:30ch;font-weight:600}
.cta{background:var(--purple);color:#fff;font-weight:800;padding:14px 28px;border-radius:999px;box-shadow:var(--shadow);transition:transform .15s}
.cta:active{transform:scale(.96)}
h2.sec{font-family:var(--display);font-weight:800;font-size:1.45rem;margin:22px 20px 12px;transform:rotate(-.6deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px}
.card{background:#fff;border-radius:28px;box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column;padding:0;color:inherit}
.card.off{opacity:.55}
.ph{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.ph b{font-size:2.8rem;font-weight:400}
.ph small{font-weight:800;font-size:.72rem;opacity:.55}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .body{padding:11px 13px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .n{font-weight:800;font-size:.92rem;line-height:1.18}
.price{font-weight:800;font-size:1.02rem}
.price.soon{font-size:.82rem;background:var(--yellow);align-self:flex-start;padding:3px 10px;border-radius:999px}
.more{margin-top:auto;font-weight:800;font-size:.82rem;background:var(--turq);padding:9px;border-radius:999px;text-align:center}
.badge{position:absolute;top:10px;left:10px;background:var(--pink);font-weight:800;font-size:.72rem;padding:4px 10px;border-radius:999px;z-index:2}
/* sheets */
.veil{position:fixed;inset:0;background:rgba(110,80,156,.38);z-index:30;display:none}
.veil.on{display:block}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--lav);border-radius:32px 32px 0 0;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.x{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:#fff;font-weight:800;color:var(--purple);box-shadow:var(--shadow)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .ph{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1/1;max-height:50vh}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--purple);opacity:.25}
.dots span.on{opacity:1;width:22px;border-radius:6px}
.info{padding:6px 20px 0}
.info h3{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.05;margin:8px 0 8px;letter-spacing:-.3px}
.info .price{font-size:1.3rem;margin-bottom:10px}
.info p{margin:10px 0;line-height:1.45;font-weight:600}
.info ul{list-style:none;padding:14px 16px;margin:12px 0;background:#fff;border-radius:20px}
.info li{padding:4px 0 4px 24px;position:relative;font-weight:700;font-size:.92rem}
.info li:before{content:"✦";position:absolute;left:0;color:#e0a800}
.info .cta{width:100%;background:var(--purple);margin-top:6px}
/* cart */
#bar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:none;align-items:center;justify-content:space-between;background:var(--purple);color:#fff;border-radius:999px;padding:11px 12px 11px 20px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.2);max-width:560px;margin:0 auto}
#bar.on{display:flex}
#bar span.go{background:var(--yellow);color:var(--purple);font-weight:800;padding:9px 16px;border-radius:999px}
.sheet h2{font-family:var(--display);font-weight:800;margin:0;padding:22px 20px 8px;font-size:1.5rem}
#items{padding:6px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:10px 12px}
.row .t{flex:1;font-weight:800;font-size:.86rem;line-height:1.2}
.row .t small{display:block;font-weight:700;opacity:.7;margin-top:2px}
.q{display:flex;align-items:center;gap:8px;font-weight:800}
.q button{width:28px;height:28px;border-radius:50%;background:var(--peach);font-weight:800;color:var(--purple)}
.empty{text-align:center;font-weight:700;opacity:.65;padding:24px 0}
.pick{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:20px;padding:10px 14px;margin:12px 0}
.pick small{flex:1;font-weight:700;font-size:.78rem;line-height:1.3;opacity:.8}
.pick .q button{width:38px;height:38px;font-size:1.2rem}
.pick .q span{min-width:30px;text-align:center;font-size:1.25rem}
.sum{padding:12px 20px 0}
.tot{display:flex;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:1.3rem;margin-bottom:4px}
.note{font-size:.8rem;font-weight:700;opacity:.75;margin:0 0 12px}
#wa{width:100%;background:#25D366;color:#fff;font-weight:800;padding:15px;border-radius:999px;box-shadow:var(--shadow);font-size:.98rem}
#wa:disabled{opacity:.5}
footer{text-align:center;font-size:.78rem;font-weight:700;opacity:.6;padding:26px 20px}
@media(min-width:720px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .hero{max-width:900px;margin:20px auto 8px}.hero h1{font-size:2.9rem}
  header{padding:10px max(16px,calc(50% - 500px))}
  h2.sec{max-width:1000px;margin-left:auto;margin-right:auto;padding:0 6px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(780px,92vw);border-radius:32px;transform:translate(-50%,-45%) scale(.96);opacity:0;pointer-events:none;transition:all .2s;padding-bottom:20px}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  #detail{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  #detail .left{padding:16px 0 16px 16px}#detail .gal{border-radius:24px}
  #cart{width:min(440px,92vw)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function csv(t){const r=[];let f="",row=[],q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}

  else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);r.push(row);row=[];f=""}
  else f+=c}
 if(f||row.length){row.push(f);r.push(row)}return r}

function fromSheet(text){const [h,...rows]=csv(text);const k=h.map(x=>x.trim().toLowerCase());

 return/^(https?:|data:)/.test(u)?u:"img/"+u}

function tile(p,i,idx,withLabel){const bg=BG[idx%BG.length],u=p.imagenes[i];
 return `<div class="ph" style="background:${bg}"><b>${p.emoji}</b>${withLabel?`<small>Foto ${i+1} de 6</small>`:""}${u?`<img src="${imgUrl(u)}" alt="${p.nombre.replace(/"/g,"")}" loading="lazy" onerror="this.remove()">`:""}</div>`}

function priceHTML(p){const n=numPrice(p.precio);
 if(n!==null)return`<div class="price">${money(n)}</div>`;
 if(p.precio)return`<div class="price">${p.precio}</div>`;
 return`<div class="price soon">Precio próximamente</div>`}

function render(){$("grid").innerHTML=P.map((p,i)=>`
 <button class="card ${p.agotado?"off":""}" onclick="openDetail(${i})">
  <div style="position:relative">${p.agotado?'<span class="badge">Agotado</span>':""}${tile(p,0,i,false)}</div>
  <div class="body"><div class="n">${p.nombre}</div>${priceHTML(p)}<div class="more">Ver kit</div></div></button>`).join("")}

function openDetail(i){const p=P[i];sel=lim(p).mn;
 $("detail").innerHTML=`<button class="x" onclick="closeAll()" aria-label="Cerrar">✕</button>
 <div class="left"><div class="gal" onscroll="dots(this)">${[0,1,2,3,4,5].map(k=>tile(p,k,i,true)).join("")}</div>
 <div class="dots">${[0,1,2,3,4,5].map(k=>`<span class="${k?"":"on"}"></span>`).join("")}</div></div>
 <div class="info"><h3>${p.nombre}</h3>${priceHTML(p)}<p>${p.descripcion}</p>
 ${p.incluye.length?`<ul>${p.incluye.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
 ${p.agotado?"":`<div class="pick"><small>${hint(p)}</small><div class="q"><button onclick="pick(${i},-1)" aria-label="Menos">−</button><span id="pq">${sel}</span><button onclick="pick(${i},1)" aria-label="Más">+</button></div></div>`}
 <button class="cta" id="addbtn" ${p.agotado?"disabled":""} onclick="add(${i})">${p.agotado?"Agotado":"Agregar "+kits(sel)+" al pedido"}</button></div>`;
 show("detail")}
function hint(p){const{mn,st}=lim(p);const a=[];if(mn>1)a.push("Pedido mínimo: "+kits(mn));if(st>1)a.push("Se suman de a "+st);return a.length?a.join(" · "):"¿Cuántos kits querés?"}
function pick(i,d){const{mn,st}=lim(P[i]);sel=Math.max(mn,sel+d*st);$("pq").textContent=sel;$("addbtn").textContent="Agregar "+kits(sel)+" al pedido"}
function dots(g){const k=Math.round(g.scrollLeft/g.clientWidth);g.parentNode.querySelectorAll(".dots span").forEach((s,j)=>s.classList.toggle("on",j==k))}
function show(id){$("veil").classList.add("on");$(id).classList.add("on")}
function closeAll(){$("veil").classList.remove("on");["detail","cart"].forEach(x=>$(x).classList.remove("on"))}
function openCart(){draw();show("cart")}
function add(i){cart[i]=(cart[i]||0)+sel;draw();closeAll()}
function qty(i,d){const{mn,st}=lim(P[i]);const n=(cart[i]||0)+d*st;n<mn?delete cart[i]:cart[i]=n;draw()}

function draw(){const ids=Object.keys(cart),count=ids.reduce((s,i)=>s+cart[i],0);
 let total=0,pend=0;ids.forEach(i=>{const n=numPrice(P[i].precio);n===null?pend++:total+=n*cart[i]});
 const c=$("cart-count");c.style.display=count?"flex":"none";c.textContent=count;
 $("bar").classList.toggle("on",count>0);
 $("bar-t").textContent=kits(count)+(total?" · "+money(total):"");
 $("items").innerHTML=count?ids.map(i=>{const n=numPrice(P[i].precio);return`<div class="row"><div class="t">${P[i].nombre}<small>${n!==null?money(n)+" c/u":"Precio a confirmar"}</small></div>
  <div class="q"><button onclick="qty(${i},-1)" aria-label="Menos">−</button>${cart[i]}<button onclick="qty(${i},1)" aria-label="Más">+</button></div></div>`}).join(""):'<div class="empty">Todavía no agregaste nada ✦<br>Elegí tu kit favorito.</div>';
 $("tot").textContent=total?money(total):"A confirmar";
 $("note").textContent=pend&&total?"Hay "+pend+(pend>1?" kits":" kit")+" con precio a confirmar.":pend?"Te confirmamos el precio por WhatsApp.":"";
 $("wa").disabled=!count}

function sendWA(){let m="¡Hola! Quiero hacer este pedido en Tiny Party:\n\n",total=0;
 Object.keys(cart).forEach(i=>{const p=P[i],n=numPrice(p.precio);if(n!==null)total+=n*cart[i];
  m+="• "+p.nombre+" x"+cart[i]+(n!==null?" — "+money(n*cart[i]):" — precio a confirmar")+"\n"});
 if(total)m+="\nTotal (sin los kits a confirmar): "+money(total);
 window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m),"_blank")}

async function init(){P=SAMPLE;
 if(SHEET_CSV_URL){try{const r=await fetch(SHEET_CSV_URL);if(!r.ok)throw 0;const d=fromSheet(await r.text());if(d.length)P=d}catch(e){console.warn("No se pudo leer la planilla, se usan los datos de ejemplo.")}}
 render();draw()}
init();
</script>
</body>
</html>

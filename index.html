button{font-family:var(--body);cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(184,231,220,.94);backdrop-filter:blur(6px)}
.wrap{max-width:1000px;margin:0 auto}
header .logo{height:52px;display:block;opacity:0;transition:opacity .25s}
header .logo.on{opacity:1}
.hero-logo{display:block;width:min(380px,82%);height:auto;margin:0 auto 4px;filter:drop-shadow(0 6px 10px rgba(110,80,156,.18))}
#cart-btn{position:relative;width:46px;height:46px;border-radius:50%;background:var(--white);font-size:1.3rem;box-shadow:var(--shadow)}
#cart-count{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--pink);border:2px solid #fff;font-size:.72rem;font-weight:800;color:var(--purple);display:none;align-items:center;justify-content:center}
.hero{margin:12px 16px 8px;padding:24px 20px 32px;background:var(--peach);border-radius:32px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero i{position:absolute;font-style:normal;font-size:1.5rem}
.hero h1{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.02;margin:0 0 8px;letter-spacing:-.5px;transform:rotate(-1.5deg)}
.hero p{margin:0 auto 18px;max-width:30ch;font-weight:600}
.cta{background:var(--purple);color:#fff;font-weight:800;padding:14px 28px;border-radius:999px;box-shadow:var(--shadow);transition:transform .15s}
.cta:active{transform:scale(.96)}
h2.sec{font-family:var(--display);font-weight:800;font-size:1.45rem;margin:22px 20px 12px;transform:rotate(-.6deg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px}
.card{background:#fff;border-radius:28px;box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column;padding:0;color:inherit}
.card.off{opacity:.55}
.ph{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;overflow:hidden}
.ph b{font-size:2.8rem;font-weight:400}
.ph small{font-weight:800;font-size:.72rem;opacity:.55}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .body{padding:11px 13px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.card .n{font-weight:800;font-size:.92rem;line-height:1.18}
.price{font-weight:800;font-size:1.02rem}
.price.soon{font-size:.82rem;background:var(--yellow);align-self:flex-start;padding:3px 10px;border-radius:999px}
.more{margin-top:auto;font-weight:800;font-size:.82rem;background:var(--turq);padding:9px;border-radius:999px;text-align:center}
.badge{position:absolute;top:10px;left:10px;background:var(--pink);font-weight:800;font-size:.72rem;padding:4px 10px;border-radius:999px;z-index:2}
.media{position:relative;cursor:zoom-in}
.media.nz{cursor:pointer}
.card .body{cursor:pointer}
.more{color:var(--purple);border:0;width:100%}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--purple);font-size:1.3rem;font-weight:800;line-height:1;padding:0 0 3px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;z-index:3}
.arr.l{left:8px}.arr.r{right:8px}
.arr:active{transform:translateY(-50%) scale(.92)}
.arr.big{width:42px;height:42px;font-size:1.6rem}
.mdots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:4px;z-index:2;pointer-events:none}
.mdots i{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.65;box-shadow:0 0 3px rgba(0,0,0,.35)}
.mdots i.on{opacity:1;width:15px;border-radius:4px}
.galwrap{position:relative}
.zm{cursor:zoom-in}
.th{flex:0 0 56px;width:56px;height:56px;border-radius:14px;overflow:hidden;cursor:zoom-in}
.th.nz{cursor:default}
.th .ph{aspect-ratio:auto;width:100%;height:100%;gap:0}
.th .ph b{font-size:1.6rem}
#lb{position:fixed;inset:0;z-index:50;background:rgba(48,30,80,.94);display:none;align-items:center;justify-content:center;padding:calc(60px + env(safe-area-inset-top,0px)) 14px calc(64px + env(safe-area-inset-bottom,0px))}
#lb.on{display:flex}
#lbimg{max-width:100%;max-height:100%;object-fit:contain;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.4);background:#fff}
#lb .arr{position:fixed;width:46px;height:46px;font-size:1.7rem}
#lb .arr.l{left:12px}#lb .arr.r{right:12px}
.lbx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:42px;height:42px;border-radius:50%;background:#fff;color:var(--purple);font-weight:800;font-size:1rem;box-shadow:var(--shadow)}
#lbcap{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:16px;right:16px;text-align:center;color:#fff;font-weight:700;font-size:.92rem}
/* sheets */
.veil{position:fixed;inset:0;background:rgba(110,80,156,.38);z-index:30;display:none}
.veil.on{display:block}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--lav);border-radius:32px 32px 0 0;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.x{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:#fff;font-weight:800;color:var(--purple);box-shadow:var(--shadow)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .ph{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1/1;max-height:50vh}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0 2px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--purple);opacity:.25}
.dots span.on{opacity:1;width:22px;border-radius:6px}
.info{padding:6px 20px 0}
.info h3{font-family:var(--display);font-weight:800;font-size:1.55rem;line-height:1.05;margin:8px 0 8px;letter-spacing:-.3px}
.info .price{font-size:1.3rem;margin-bottom:10px}
.info .price.soon{display:inline-block;font-size:.95rem;padding:5px 14px}
.info p{margin:10px 0;line-height:1.45;font-weight:600}
.info ul{list-style:none;padding:14px 16px;margin:12px 0;background:#fff;border-radius:20px}
.info li{padding:4px 0 4px 24px;position:relative;font-weight:700;font-size:.92rem}
.info li:before{content:"✦";position:absolute;left:0;color:#e0a800}
.info .cta{width:100%;background:var(--purple);margin-top:6px}
/* cart */
#bar{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:none;align-items:center;justify-content:space-between;background:var(--purple);color:#fff;border-radius:999px;padding:11px 12px 11px 20px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.2);max-width:560px;margin:0 auto}
#bar.on{display:flex}
#bar span.go{background:var(--yellow);color:var(--purple);font-weight:800;padding:9px 16px;border-radius:999px}
.sheet h2{font-family:var(--display);font-weight:800;margin:0;padding:22px 20px 8px;font-size:1.5rem}
#items{padding:6px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:10px 12px}
.row .t{flex:1;font-weight:800;font-size:.86rem;line-height:1.2}
.row .t small{display:block;font-weight:700;opacity:.7;margin-top:2px}
.q{display:flex;align-items:center;gap:8px;font-weight:800}
.q button{width:28px;height:28px;border-radius:50%;background:var(--peach);font-weight:800;color:var(--purple)}
.empty{text-align:center;font-weight:700;opacity:.65;padding:24px 0}
.pick{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:20px;padding:10px 14px;margin:12px 0}
.pick small{flex:1;font-weight:700;font-size:.78rem;line-height:1.3;opacity:.8}
.pick .q button{width:38px;height:38px;font-size:1.2rem}
.pick .q span{min-width:30px;text-align:center;font-size:1.25rem}
.sum{padding:12px 20px 0}
.tot{display:flex;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:1.3rem;margin-bottom:4px}
.note{font-size:.8rem;font-weight:700;opacity:.75;margin:0 0 12px}
#wa{width:100%;background:#25D366;color:#fff;font-weight:800;padding:15px;border-radius:999px;box-shadow:var(--shadow);font-size:.98rem}
#wa:disabled{opacity:.5}
footer{text-align:center;font-size:.78rem;font-weight:700;opacity:.85;padding:26px 20px}
@media(min-width:720px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .hero{max-width:900px;margin:20px auto 8px}.hero h1{font-size:2.2rem}.hero-logo{width:420px}
  header{padding:10px max(16px,calc(50% - 500px))}
  h2.sec{max-width:1000px;margin-left:auto;margin-right:auto;padding:0 6px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(780px,92vw);border-radius:32px;transform:translate(-50%,-45%) scale(.96);opacity:0;pointer-events:none;transition:all .2s;padding-bottom:20px}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  #detail{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  #detail .left{padding:16px 0 16px 16px}#detail .gal{border-radius:24px}
  #cart{width:min(440px,92vw)}
}
@media(max-aspect-ratio:1/1){body::before{background-position:12% center}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

];
const BG=["var(--mint)","var(--peach)","var(--lav)","var(--turq)"];
let P=[],cart={};
const $=id=>document.getElementById(id);
const money=n=>"$"+n.toLocaleString("es-AR");
const lim=p=>({mn:p.minimo||MIN_DEFAULT,st:p.pack||PACK_DEFAULT});
const kits=n=>n+(n==1?" kit":" kits");
let sel=1,cur={},det=-1,lb={i:0,k:0},lastSwipe=0;
const numPrice=p=>/^\$?\s*[\d.,]+$/.test(p||"")?parseInt(p.replace(/\D/g,""),10):null;

function csv(t){const r=[];let f="",row=[],q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
  else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);r.push(row);row=[];f=""}
  else f+=c}
 if(f||row.length){row.push(f);r.push(row)}return r}

function fromSheet(text){const [h,...rows]=csv(text);const k=h.map(x=>x.trim().toLowerCase());
 return rows.filter(r=>r.some(x=>x.trim())).map(r=>{const o={};k.forEach((c,i)=>o[c]=(r[i]||"").trim());
  return{nombre:o.nombre,emoji:o.emoji||"🎁",precio:o.precio,descripcion:o.descripcion,
   incluye:(o.incluye||"").split("|").map(s=>s.trim()).filter(Boolean),
   imagenes:[1,2,3,4,5,6].map(n=>o["imagen"+n]).filter(Boolean),
   minimo:parseInt(o.minimo)||0,pack:parseInt(o.pack)||0,
   agotado:/^no$/i.test(o.disponible||"")}}).filter(p=>p.nombre)}

function imgUrl(u){const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*?id=)([\w-]+)/);
 if(m)return"https://drive.google.com/thumbnail?id="+m[1]+"&sz=w900";
 return/^(https?:|data:)/.test(u)?u:"img/"+u}

function tile(p,i,idx,withLabel,z){const bg=BG[idx%BG.length],u=p.imagenes[i];
 return `<div class="ph${u&&z?" zm":""}" style="background:${bg}"${u&&z?` onclick="zoom(${idx},${i})"`:""}><b>${p.emoji}</b>${withLabel&&!u?"<small>Foto próximamente</small>":""}${u?`<img src="${imgUrl(u)}" alt="${p.nombre.replace(/"/g,"")}" loading="lazy" onerror="this.remove()">`:""}</div>`}

function priceHTML(p){const n=numPrice(p.precio);
 if(n!==null)return`<div class="price">${money(n)}</div>`;
 if(p.precio)return`<div class="price">${p.precio}</div>`;
 return`<div class="price soon">Precio próximamente</div>`}

function mediaHTML(i){const p=P[i],n=p.imagenes.length,k=cur[i]||0;
 return(p.agotado?'<span class="badge">Agotado</span>':"")+tile(p,k,i,false)+
 (n>1?`<button class="arr l" onclick="cardGo(${i},-1,event)" aria-label="Foto anterior">‹</button><button class="arr r" onclick="cardGo(${i},1,event)" aria-label="Foto siguiente">›</button><div class="mdots">${p.imagenes.map((_,j)=>`<i class="${j==k?"on":""}"></i>`).join("")}</div>`:"")}
function cardGo(i,d,e){e.stopPropagation();const n=P[i].imagenes.length;cur[i]=((cur[i]||0)+d+n)%n;$("m"+i).innerHTML=mediaHTML(i)}
function zoomCard(i){zoom(i,cur[i]||0,true)}
function render(){cur={};$("grid").innerHTML=P.map((p,i)=>`
 <div class="card ${p.agotado?"off":""}">
  <div class="media${p.imagenes.length?"":" nz"}" id="m${i}" data-i="${i}" onclick="zoomCard(${i})">${mediaHTML(i)}</div>
  <div class="body" onclick="openDetail(${i})"><div class="n">${p.nombre}</div>${priceHTML(p)}<button class="more">Ver kit</button></div></div>`).join("")}

function openDetail(i){const p=P[i];sel=lim(p).mn;det=i;const n=Math.max(1,p.imagenes.length),ks=[...Array(n).keys()];
 $("detail").innerHTML=`<button class="x" onclick="closeAll()" aria-label="Cerrar">✕</button>
 <div class="left"><div class="galwrap"><div class="gal" onscroll="dots(this)">${ks.map(k=>tile(p,k,i,true,true)).join("")}</div>${n>1?`<button class="arr l big" onclick="galGo(-1)" aria-label="Foto anterior">‹</button><button class="arr r big" onclick="galGo(1)" aria-label="Foto siguiente">›</button>`:""}</div>
 ${n>1?`<div class="dots">${ks.map(k=>`<span class="${k?"":"on"}"></span>`).join("")}</div>`:""}</div>
 <div class="info"><h3>${p.nombre}</h3>${priceHTML(p)}<p>${p.descripcion}</p>
 ${p.incluye.length?`<ul>${p.incluye.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}
 ${p.agotado?"":`<div class="pick"><small>${hint(p)}</small><div class="q"><button onclick="pick(${i},-1)" aria-label="Menos">−</button><span id="pq">${sel}</span><button onclick="pick(${i},1)" aria-label="Más">+</button></div></div>`}
 <button class="cta" id="addbtn" ${p.agotado?"disabled":""} onclick="add(${i})">${p.agotado?"Agotado":"Agregar "+kits(sel)+" al pedido"}</button></div>`;
 show("detail")}
function hint(p){const{mn,st}=lim(p);const a=[];if(mn>1)a.push("Pedido mínimo: "+kits(mn));if(st>1)a.push("Se suman de a "+st);return a.length?a.join(" · "):"¿Cuántos kits querés?"}
function pick(i,d){const{mn,st}=lim(P[i]);sel=Math.max(mn,sel+d*st);$("pq").textContent=sel;$("addbtn").textContent="Agregar "+kits(sel)+" al pedido"}
function galGo(d){const g=document.querySelector("#detail .gal"),n=g.children.length,k=(Math.round(g.scrollLeft/g.clientWidth)+d+n)%n;g.scrollTo({left:k*g.clientWidth,behavior:"smooth"})}
function dots(g){const k=Math.round(g.scrollLeft/g.clientWidth);g.closest(".left").querySelectorAll(".dots span").forEach((s,j)=>s.classList.toggle("on",j==k))}
function show(id){$("veil").classList.add("on");$(id).classList.add("on")}
function closeAll(){$("veil").classList.remove("on");["detail","cart"].forEach(x=>$(x).classList.remove("on"))}
function openCart(){draw();show("cart")}
function add(i){cart[i]=(cart[i]||0)+sel;draw();closeAll()}
function qty(i,d){const{mn,st}=lim(P[i]);const n=(cart[i]||0)+d*st;n<mn?delete cart[i]:cart[i]=n;draw()}

function draw(){const ids=Object.keys(cart),count=ids.reduce((s,i)=>s+cart[i],0);
 let total=0,pend=0;ids.forEach(i=>{const n=numPrice(P[i].precio);n===null?pend++:total+=n*cart[i]});
 const c=$("cart-count");c.style.display=count?"flex":"none";c.textContent=count;
 $("bar").classList.toggle("on",count>0);
 $("bar-t").textContent=kits(count)+(total?" · "+money(total):"");
 $("items").innerHTML=count?ids.map(i=>{const n=numPrice(P[i].precio);return`<div class="row"><div class="th${P[i].imagenes.length?"":" nz"}" onclick="zoom(${i},0)">${tile(P[i],0,i,false)}</div><div class="t">${P[i].nombre}<small>${n!==null?money(n)+" c/u":"Precio a confirmar"}</small></div>
  <div class="q"><button onclick="qty(${i},-1)" aria-label="Menos">−</button>${cart[i]}<button onclick="qty(${i},1)" aria-label="Más">+</button></div></div>`}).join(""):'<div class="empty">Todavía no agregaste nada ✦<br>Elegí tu kit favorito.</div>';
 $("tot").textContent=total?money(total):"A confirmar";
 $("note").textContent=pend&&total?"Hay "+pend+(pend>1?" kits":" kit")+" con precio a confirmar.":pend?"Te confirmamos el precio por WhatsApp.":"";
 $("wa").disabled=!count}

function sendWA(){let m="¡Hola! Quiero hacer este pedido en Tiny Party:\n\n",total=0;
 Object.keys(cart).forEach(i=>{const p=P[i],n=numPrice(p.precio);if(n!==null)total+=n*cart[i];
  m+="• "+p.nombre+" x"+cart[i]+(n!==null?" — "+money(n*cart[i]):" — precio a confirmar")+"\n"});
 if(total)m+="\nTotal (sin los kits a confirmar): "+money(total);
 window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m),"_blank")}

function zoom(i,k,fromCard){if(Date.now()-lastSwipe<350)return;
 if(!P[i].imagenes.length){if(fromCard)openDetail(i);return}
 lb={i,k};lbShow();$("lb").classList.add("on")}
function lbShow(){const p=P[lb.i],n=p.imagenes.length;
 $("lbimg").src=imgUrl(p.imagenes[lb.k]);$("lbimg").alt=p.nombre;
 $("lbcap").textContent=p.nombre+(n>1?" · "+(lb.k+1)+" / "+n:"");
 document.querySelectorAll(".lb-a").forEach(b=>b.style.display=n>1?"flex":"none");
 if(n>1)new Image().src=imgUrl(p.imagenes[(lb.k+1)%n])}
function lbGo(d){const n=P[lb.i].imagenes.length;lb.k=(lb.k+d+n)%n;lbShow()}
function lbClose(){$("lb").classList.remove("on");$("lbimg").removeAttribute("src");
 if($("m"+lb.i)){cur[lb.i]=lb.k;$("m"+lb.i).innerHTML=mediaHTML(lb.i)}
 const g=document.querySelector("#detail .gal");if(g&&det===lb.i&&$("detail").classList.contains("on"))g.scrollTo({left:lb.k*g.clientWidth})}
document.addEventListener("keydown",e=>{const o=$("lb").classList.contains("on");
 if(e.key=="Escape")o?lbClose():closeAll();
 else if(o&&e.key=="ArrowRight")lbGo(1);else if(o&&e.key=="ArrowLeft")lbGo(-1)});
function swipe(el,fn){let x=null,y=0;
 el.addEventListener("touchstart",e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});
 el.addEventListener("touchend",e=>{if(x===null)return;const d=e.changedTouches[0].clientX-x,v=e.changedTouches[0].clientY-y;x=null;
  if(Math.abs(d)>45&&Math.abs(v)<Math.abs(d)){lastSwipe=Date.now();fn(d<0?1:-1,e)}},{passive:true})}
swipe($("lb"),d=>lbGo(d));
swipe($("grid"),(d,e)=>{const m=e.target.closest&&e.target.closest(".media");if(m&&P[m.dataset.i].imagenes.length>1)cardGo(+m.dataset.i,d,{stopPropagation(){}})});

function sheetUrl(u){u=u.trim();const g=(u.match(/[?&#]gid=(\d+)/)||[])[1],q=g?"&gid="+g:"";
 let m=u.match(/spreadsheets\/d\/e\/([\w-]+)/);
 if(m)return"https://docs.google.com/spreadsheets/d/e/"+m[1]+"/pub?output=csv"+q;
 m=u.match(/spreadsheets\/d\/([\w-]+)/);
 if(m)return"https://docs.google.com/spreadsheets/d/"+m[1]+"/gviz/tq?tqx=out:csv"+q;
 return u}
function note(msg,ok){if(!/[?&]debug/.test(location.search))return;
 const d=document.createElement("div");d.style.cssText="margin:10px 16px 0;padding:10px 14px;border-radius:16px;font-weight:700;font-size:.85rem;background:"+(ok?"var(--turq)":"var(--yellow)");
 d.textContent=(ok?"✓ ":"⚠️ ")+msg;document.querySelector("header").after(d)}
async function init(){
 try{const hl=$("hlogo"),rl=$("rlogo"),hd=document.querySelector("header");hl.src=rl.src;
  const upd=()=>{const y=scrollY,max=document.documentElement.scrollHeight-innerHeight,r=rl.getBoundingClientRect();
   /* aparece cuando el logo grande queda tapado por el header, o si la página casi no scrollea, al pasar la mitad del recorrido */
   hl.classList.toggle("on",r.top+r.height/2<hd.offsetHeight||(y>30&&y>=max*.5))};
  addEventListener("scroll",upd,{passive:true});addEventListener("resize",upd);rl.addEventListener("load",upd);upd()}catch(e){}
 P=SAMPLE;render();draw();
 if(!SHEET_CSV_URL){note("Falta pegar el link de la planilla en SHEET_CSV_URL. Mostrando datos de ejemplo.");return}
 try{const r=await fetch(sheetUrl(SHEET_CSV_URL));if(!r.ok)throw new Error("Google respondió "+r.status+". Revisá que la planilla esté publicada en la web.");
  const t=await r.text();
  if(/^\s*<(!doctype|html)/i.test(t))throw new Error("El link devolvió una página web y no los datos. Publicá la hoja en formato CSV (Archivo → Compartir → Publicar en la web).");
  const d=fromSheet(t);
  if(!d.length)throw new Error("No se encontraron productos. La primera fila debe tener la columna 'nombre'. Columnas leídas: "+csv(t)[0].join(", "));
  P=d;cart={};render();draw();note("Planilla conectada: "+d.length+" productos.",true)}
 catch(e){console.warn("Tiny Party:",e);P=SAMPLE;cart={};try{render();draw()}catch(_){}
  note(e.message+" Mostrando datos de ejemplo.")}}
init();
</script>
